name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Assemble release APK
        run: gradle assembleRelease --no-daemon
      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Respir-1.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Respir-apk
          path: dist/Respir-1.0.0.apk
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Respir 1.0.0
          body: |
            APK installable Respir — rappel horaire.
            Compatible Android 8+ / One UI 8 / Galaxy Z Fold.

            Installation :
            1. Télécharge Respir-1.0.0.apk
            2. Ouvre le fichier sur le téléphone (autoriser sources inconnues)
            3. Active les rappels + notifications
            4. Applications → Respir → Batterie → Non restreint
          files: dist/Respir-1.0.0.apk
          make_latest: true
